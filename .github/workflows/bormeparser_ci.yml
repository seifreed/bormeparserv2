name: Bormeparser CI

on: ["push", "pull_request"]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: 'Documentation build'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_doc.txt
          pip install -e .
          git rev-parse HEAD
      - name: Build html docs
        run: cd docs && make html SPHINXOPTS="-W"

  lint:
    name: 'Lint, types and security'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy bandit pip-audit types-requests lxml-stubs
          pip install -r requirements.txt
      - name: ruff
        run: ruff check .
      - name: black
        run: black --check .
      - name: mypy
        run: mypy bormeparser
      - name: bandit
        run: bandit -r bormeparser scripts
      - name: pip-audit
        run: pip-audit --strict -r requirements.txt

  hadolint:
    name: 'Dockerfile lint'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  actionlint:
    name: 'GitHub Actions lint'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: actionlint
        uses: raven-actions/actionlint@v2

  test:
    name: 'Bormeparser tests (py${{ matrix.python-version }})'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install coveralls
          pip install -r requirements.txt
          ./setup.py -q develop
      - name: Run tests
        run: coverage run --source=bormeparser setup.py test
      - name: Publish to coveralls.io
        if: matrix.python-version == '3.13'
        run: coveralls --service=github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
