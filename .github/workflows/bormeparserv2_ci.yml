name: Bormeparserv2 CI

on: ["push", "pull_request"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: 'Documentation build'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          git rev-parse HEAD
      - name: Build html docs
        run: cd docs && make html SPHINXOPTS="-W"

  lint:
    name: 'Lint, types and security'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: ruff
        run: ruff check .
      - name: black
        run: black --check .
      - name: mypy
        run: mypy bormeparserv2
      - name: bandit
        run: bandit -r bormeparserv2 scripts -x bormeparserv2/tests
      - name: pip-audit
        run: pip-audit --strict -r requirements.txt

  sbom:
    name: 'SBOM quality gate'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Install sbom-tools
        run: cargo install sbom-tools --version 0.1.21 --locked
      - name: Generate SBOM
        run: python scripts/generate_sbom.py -o build/sbom/bormeparserv2.cdx.json
      - name: Validate SBOM
        run: ~/.cargo/bin/sbom-tools validate build/sbom/bormeparserv2.cdx.json --standard ntia --fail-on-warning
      - name: Assess SBOM quality
        run: ~/.cargo/bin/sbom-tools quality build/sbom/bormeparserv2.cdx.json --profile standard -o json -O build/sbom/bormeparserv2.quality.json
      - name: Check SBOM rating
        run: python scripts/check_sbom_rating.py build/sbom/bormeparserv2.quality.json --profile standard --min-score 90 --min-grade A

  hadolint:
    name: 'Dockerfile lint'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  actionlint:
    name: 'GitHub Actions lint'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: actionlint
        uses: raven-actions/actionlint@v2

  test:
    name: 'Bormeparserv2 tests (py${{ matrix.python-version }})'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt
          pip install -e .
      - name: Run tests
        run: coverage run -m unittest discover bormeparserv2.tests
      - name: Enforce 100% coverage
        run: coverage report
      - name: Generate coverage XML
        if: matrix.python-version == '3.13'
        run: coverage xml -o coverage.xml
      - name: Publish to coveralls.io
        if: matrix.python-version == '3.13'
        run: coveralls --service=github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload coverage reports to Codecov
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v6.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: seifreed/bormeparserv2
          files: ./coverage.xml
